<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — PLMun Verse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="signin.css">
</head>
<body>

<nav>
  <div class="nav-inner">
    <div class="logo">
      <span class="logo-mark">
        <img src="logo1.png" alt="Logo">
      </span>
      <span>PLMUN VERSE</span>
    </div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="signin.html" class="active">Sign in</a>
      <a href="signup.html">Sign up</a>
    </div>
  </div>
</nav>

<header class="page-head">
  <div class="wrap">
    <span class="eyebrow">Welcome back</span>
    <h1>Sign in to your account</h1>
    <p class="lede">Pick up where you left off — your followed orgs, saved events, and applications.</p>
  </div>
</header>

<section class="auth-section">
  <div class="wrap">
    <div class="auth-card">

      <form action="#" method="post">
        <div class="field">
          <label for="email">PLMun email</label>
          <input type="email" id="email" name="email" placeholder="juandelacruz@plmun.edu.ph" required>
        </div>

        <div class="field">
          <div class="field-label-row">
            <label for="password">Password</label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>

        <label class="checkbox-row">
          <input type="checkbox">
          <span>Keep me signed in</span>
        </label>

        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>

    </div>
  </div>
</section>

<footer>
  <div class="wrap foot-inner">
    <span>PLMun Verse — Pamantasan ng Lungsod ng Muntinlupa</span>
    <span>© 2026</span>
  </div>
</footer>

</body>
</html>
